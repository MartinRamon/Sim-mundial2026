<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Trofeo de la Copa del Mundo">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.45" stop-color="#f5c542"/>
      <stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
  </defs>
  <!-- base / pedestal -->
  <rect x="23" y="52" width="18" height="4" rx="2" fill="url(#gold)"/>
  <rect x="19" y="56" width="26" height="6" rx="3" fill="url(#gold)"/>
  <!-- twin supports (figuras que sostienen el globo) -->
  <path d="M27.5,51 C18.5,43 22,28 31,25.5" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
  <path d="M36.5,51 C45.5,43 42,28 33,25.5" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
  <!-- columna central -->
  <rect x="29" y="42" width="6" height="11" rx="2.5" fill="url(#gold)"/>
  <!-- globo terraqueo -->
  <circle cx="32" cy="17" r="9.5" fill="url(#gold)"/>
  <ellipse cx="32" cy="17" rx="9.5" ry="4" fill="none" stroke="#7a5c0a" stroke-opacity="0.55" stroke-width="1.1"/>
  <ellipse cx="32" cy="17" rx="4" ry="9.5" fill="none" stroke="#7a5c0a" stroke-opacity="0.45" stroke-width="1.1"/>
  <line x1="22.5" y1="17" x2="41.5" y2="17" stroke="#7a5c0a" stroke-opacity="0.45" stroke-width="1.1"/>
</svg>
