<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Trofeo de la Copa Mundial de la FIFA">
  <defs>
    <linearGradient id="wcGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6cf"/>
      <stop offset="0.42" stop-color="#f6c945"/>
      <stop offset="1" stop-color="#c2890f"/>
    </linearGradient>
    <linearGradient id="wcGoldFoot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9d871"/>
      <stop offset="1" stop-color="#b87d0a"/>
    </linearGradient>
    <linearGradient id="wcGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2fae5f"/>
      <stop offset="1" stop-color="#137a3a"/>
    </linearGradient>
  </defs>

  <!-- Cuerpo: dos figuras que se enroscan sosteniendo el globo -->
  <path d="M32 20.3
           C 29 19.2 24.5 20.5 22.6 25.2
           C 20.8 30 26.5 38 29.4 43.4
           L 29.4 45.4 L 34.6 45.4 L 34.6 43.4
           C 37.5 38 43.2 30 41.4 25.2
           C 39.5 20.5 35 19.2 32 20.3 Z"
        fill="url(#wcGold)" stroke="#6b4e07" stroke-width="1.1" stroke-linejoin="round"/>
  <!-- Costura central (efecto torsion) -->
  <path d="M32 21.6 C 30.8 27 30.8 37 32 43.6" fill="none" stroke="#8a6a12" stroke-opacity="0.55" stroke-width="0.9" stroke-linecap="round"/>

  <!-- Globo terraqueo -->
  <circle cx="32" cy="14" r="8.2" fill="url(#wcGold)" stroke="#6b4e07" stroke-width="1.1"/>
  <ellipse cx="32" cy="14" rx="8.2" ry="3.3" fill="none" stroke="#7a5c0a" stroke-opacity="0.5" stroke-width="0.9"/>
  <line x1="23.9" y1="14" x2="40.1" y2="14" stroke="#7a5c0a" stroke-opacity="0.45" stroke-width="0.9"/>
  <line x1="32" y1="5.9" x2="32" y2="22.1" stroke="#7a5c0a" stroke-opacity="0.4" stroke-width="0.9"/>
  <!-- continentes esquematicos -->
  <path d="M28 11 c1.4-1 3-0.6 3.3 0.6 c0.2 0.9-0.8 1.5-1.7 1.4 c-1.1-0.1-2.3-1.1-1.6-2z" fill="#b9860c" fill-opacity="0.55"/>
  <path d="M34 15.2 c1.3-0.3 2.6 0.4 2.3 1.5 c-0.3 1-1.8 1-2.6 0.4 c-0.7-0.5-0.6-1.7 0.3-1.9z" fill="#b9860c" fill-opacity="0.55"/>

  <!-- Base con anillos de malaquita -->
  <rect x="27.8" y="45" width="8.4" height="2.4" rx="1.1" fill="url(#wcGold)" stroke="#6b4e07" stroke-width="0.9"/>
  <rect x="25.6" y="47.2" width="12.8" height="2.4" rx="1" fill="url(#wcGreen)" stroke="#0c5a2a" stroke-width="0.8"/>
  <rect x="24.2" y="49.5" width="15.6" height="1.8" rx="0.9" fill="url(#wcGold)" stroke="#6b4e07" stroke-width="0.8"/>
  <rect x="23" y="51.2" width="18" height="2.4" rx="1" fill="url(#wcGreen)" stroke="#0c5a2a" stroke-width="0.8"/>
  <path d="M21.6 53.4 H42.4 a2 2 0 0 1 2 2 v1.4 a2 2 0 0 1-2 2 H21.6 a2 2 0 0 1-2-2 v-1.4 a2 2 0 0 1 2-2 z"
        fill="url(#wcGoldFoot)" stroke="#6b4e07" stroke-width="1"/>
</svg>
